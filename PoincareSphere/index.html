<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ポアンカレ球ビューア</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
    background: #14171c;
    color: #e6e9ef;
    display: flex;
    overflow: hidden;
  }

  /* ---- 入力パネル ---- */
  #panel {
    width: 280px;
    flex: none;
    padding: 16px;
    background: #1c2027;
    border-right: 1px solid #2c313a;
    overflow-y: auto;
  }
  /* ---- アプリ切り替えナビ（GitHub Pages で 3 アプリを行き来する） ---- */
  .appnav { display: flex; gap: 4px; margin-bottom: 12px; }
  .appnav a {
    flex: 1;
    text-align: center;
    padding: 5px 2px;
    font-size: 11px;
    color: #9aa4b2;
    text-decoration: none;
    border: 1px solid #2c313a;
    border-radius: 4px;
    background: #171b21;
  }
  .appnav a:hover { border-color: #8ecbff; color: #cdd3dc; }
  .appnav a.current { border-color: #8ecbff; background: #24303f; color: #8ecbff; cursor: default; }

  #panel h1 {
    font-size: 16px;
    margin-bottom: 14px;
    color: #8ecbff;
  }
  fieldset {
    border: 1px solid #2c313a;
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 14px;
  }
  legend { font-size: 12px; color: #9aa4b2; padding: 0 6px; }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 6px 0;
  }
  .row label { font-size: 12px; }
  .row input {
    width: 96px;
    padding: 4px 6px;
    font-size: 13px;
    color: #e6e9ef;
    background: #14171c;
    border: 1px solid #3a4150;
    border-radius: 4px;
    text-align: right;
  }
  .row input:focus { outline: 1px solid #8ecbff; }
  .unit { font-size: 11px; color: #9aa4b2; margin-left: 4px; width: 24px; }

  /* ---- 測定条件の行 ---- */
  .cond-head {
    display: flex;
    gap: 6px;
    font-size: 11px;
    color: #9aa4b2;
    margin: 2px 0 4px 16px;
  }
  .cond-head span { width: 72px; text-align: center; }
  .cond { display: flex; align-items: center; gap: 6px; margin: 5px 0; }
  .cond .sw { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .cond input {
    width: 72px;
    padding: 4px 6px;
    font-size: 13px;
    color: #e6e9ef;
    background: #14171c;
    border: 1px solid #3a4150;
    border-radius: 4px;
    text-align: right;
  }
  .cond input:focus { outline: 1px solid #8ecbff; }
  .cond .del {
    flex: none;
    width: 22px;
    height: 22px;
    border: 1px solid #3a4150;
    border-radius: 4px;
    background: none;
    color: #9aa4b2;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
  }
  .cond .del:hover { color: #ff8080; border-color: #ff8080; }
  #addCond {
    margin-top: 8px;
    padding: 4px 10px;
    border: 1px solid #3a4150;
    border-radius: 4px;
    background: none;
    color: #8ecbff;
    font-size: 12px;
    cursor: pointer;
  }
  #addCond:hover { border-color: #8ecbff; }

  #result {
    font-size: 12px;
    line-height: 1.7;
    background: #14171c;
    border: 1px solid #2c313a;
    border-radius: 6px;
    padding: 10px 12px;
    white-space: pre-line;
  }
  #result .err { color: #ff8080; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
  .dot.in  { background: #ffffff; }

  #hint { font-size: 11px; color: #6d7684; margin-top: 12px; line-height: 1.6; }

  /* ---- ビュー領域 ---- */
  #views {
    flex: 1;
    position: relative;
    display: grid;
    grid-template-rows: 3fr 1.4fr;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 4px;
    padding: 4px;
    min-width: 0;
  }
  .view {
    position: relative;
    border: 1px solid #2c313a;
    border-radius: 4px;
    overflow: hidden;
    min-width: 0;
    min-height: 0;
  }
  .view canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .view.main { grid-column: 1 / span 3; }
  .view .caption {
    position: absolute;
    top: 6px;
    left: 8px;
    font-size: 11px;
    color: #9aa4b2;
    background: rgba(20, 23, 28, 0.7);
    padding: 2px 6px;
    border-radius: 3px;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div id="panel">
    <nav class="appnav">
      <a href="../Waveplate/">波長板</a>
      <a class="current" href="./">ポアンカレ球</a>
      <a href="../MOA/">分子配向計</a>
      <a href="../ParallelNicol/">平行ニコル</a>
    </nav>
    <h1>ポアンカレ球ビューア</h1>

    <fieldset>
      <legend>ストークスパラメータ（自動正規化）</legend>
      <div class="row"><label for="s1">S1</label><span><input id="s1" type="number" step="0.1" value="1"><span class="unit"></span></span></div>
      <div class="row"><label for="s2">S2</label><span><input id="s2" type="number" step="0.1" value="0"><span class="unit"></span></span></div>
      <div class="row"><label for="s3">S3</label><span><input id="s3" type="number" step="0.1" value="0"><span class="unit"></span></span></div>
    </fieldset>

    <fieldset>
      <legend>位相差板</legend>
      <div class="row"><label for="theta">進相軸角度 θ（全条件共通）</label><span><input id="theta" type="number" step="1" value="45"><span class="unit">度</span></span></div>
    </fieldset>

    <fieldset>
      <legend>測定条件（波長・リタデーション）</legend>
      <div class="cond-head"><span>波長 λ [nm]</span><span>R [nm]</span></div>
      <div id="conds"></div>
      <button id="addCond" type="button">＋ 条件を追加</button>
    </fieldset>

    <div id="result">計算中…</div>

    <div id="hint">
      メイン3Dビュー: ドラッグで回転 / ホイールでズーム<br>
      <span class="dot in"></span>入力偏光　出力点・軌跡は波長に応じた色で表示<br>
      北極 S3=+1: 右円偏光 / 南極 S3=−1: 左円偏光
    </div>
  </div>

  <div id="views">
    <div class="view main" id="view-main"><canvas></canvas><span class="caption">3Dビュー（ドラッグで回転）</span></div>
    <div class="view" id="view-bottom"><canvas></canvas><span class="caption">平面図（北極側から）</span></div>
    <div class="view" id="view-s1"><canvas></canvas><span class="caption">側面図（+S1 方向から）</span></div>
    <div class="view" id="view-s2"><canvas></canvas><span class="caption">側面図（+S2 方向から）</span></div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
